<!doctype html>
<html lang="ms">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guru • TEMIN Kuiz</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main class="wrap dashboard">
<nav class="topbar">
  <a class="brand" href="index.html"><img src="https://raw.githubusercontent.com/skteminofficial/assets/main/logos/logo-sk-temin.png" alt=""><span><b>TEMIN</b><small>KUIZ • GURU</small></span></a>
  <button class="ghost-btn" id="logout">Keluar</button>
</nav>

<section class="teacher-hero">
  <div><span class="badge">✨ MODE MUDAH</span><h1>Jana Kuiz Cepat</h1>
  <p>Pilih apa yang diperlukan. TEMIN akan urus selebihnya.</p></div>
  <div class="magic">⚡</div>
</section>

<section class="quick-card">
<form id="quickForm">
  <div class="form-grid">
    <label>Subjek<select id="subject" required><option value="">Memuatkan...</option></select></label>
    <label>Tahun<select id="year" required><option value="">Memuatkan...</option></select></label>
    <label class="wide">Topik / Unit<input id="topic" required placeholder="Contoh: Masa dan Waktu"></label>
    <label>Bilangan Soalan<select id="questionCount"><option>10</option><option selected>15</option><option>20</option><option>25</option><option>30</option></select></label>
  </div>
  <button class="generate" type="submit">⚡ JANA KUIZ CEPAT</button>
  <button class="advanced" type="button" id="advanced">⚙ Tetapan Lanjut <span>▾</span></button>
  <div id="advancedPanel" class="advanced-panel hidden">
    <p>Build seterusnya: aras, mod, timer, shuffle dan tema akan tersedia di sini tanpa mengganggu Mode Mudah.</p>
  </div>
</form>
<p id="teacherMessage" class="form-message center"></p>
</section>

<section class="shortcut-grid">
 <button><span>📁</span><b>Kuiz Saya</b><small>Kuiz yang pernah dijana</small></button>
 <button><span>🏫</span><b>Bank Sekolah</b><small>Guna semula kuiz tersedia</small></button>
 <button><span>🎮</span><b>Mulakan Sesi</b><small>Jana kod kelas</small></button>
</section>
</main>
<script src="js/config.js"></script>
<script src="js/teacher.js"></script>
</body></html>
