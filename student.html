<!doctype html>
<html lang="ms">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murid • TEMIN Kuiz</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main class="wrap student-page">
<a class="back" href="index.html">← Kembali</a>
<section class="student-head"><span>🎮</span><div><small>TEMIN KUIZ</small><h1 id="studentTitle">Jom Belajar!</h1><p id="studentIntro">Pilih cara kamu mahu belajar hari ini.</p></div></section>

<section id="selfPanel" class="student-panel">
 <div class="panel-title"><span>🚀</span><div><small>SELF LEARNING</small><h2>Belajar Sendiri</h2></div></div>
 <div class="form-grid">
  <label>Tahun<select id="studentYear"><option>Memuatkan...</option></select></label>
  <label>Subjek<select id="studentSubject"><option>Memuatkan...</option></select></label>
 </div>
 <button class="generate demo">🚀 PILIH KUIZ</button>
</section>

<section id="livePanel" class="student-panel live-panel">
 <div class="panel-title"><span>⚡</span><div><small>LIVE CLASS</small><h2>Masuk Kelas</h2></div></div>
 <form id="joinForm">
  <label>Kod Kelas<input id="classCode" maxlength="12" autocomplete="off" placeholder="TEMIN-6284"></label>
  <button class="generate yellow" type="submit">⚡ MASUK KELAS</button>
 </form>
 <p id="joinMessage" class="form-message"></p>
</section>
<div class="student-motto">✨ The More You Do, <b>The More You Get.</b></div>
</main>
<script src="js/config.js"></script>
<script src="js/student.js"></script>
</body></html>
